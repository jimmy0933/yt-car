name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: v0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 等簽章 Secrets，請先到 Settings → Secrets and variables → Actions 設定"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ytcar.jks"
          echo "YTCAR_KEYSTORE=$RUNNER_TEMP/ytcar.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          YTCAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YTCAR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YTCAR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "YtCar-$VERSION.apk"
          rm -f "$RUNNER_TEMP/ytcar.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: YtCar ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            自動建置：${{ github.event.head_commit.message }}
            下載下方的 APK，在手機上安裝即可（已安裝舊版的可以直接覆蓋升級）。
          files: YtCar-*.apk

      - name: Delete old releases (keep latest only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            if [ "$tag" != "$VERSION" ]; then
              echo "刪除舊版 $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
